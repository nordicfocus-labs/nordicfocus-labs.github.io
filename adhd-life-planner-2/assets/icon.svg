<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1a"/>
      <stop offset="100%" stop-color="#03060a"/>
    </linearGradient>
    <linearGradient id="cyanMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glassFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Glass Shell -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle High-Tech Hex Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#1c324a" stroke-width="2.5" opacity="0.6"/>

  <!-- Orbital High-Tech Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="10 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>

  <!-- Nordic Prism Diamond (Precision Daily Focus) -->
  <polygon points="256,120 376,256 256,392 136,256" fill="url(#cyanMintGrad)" filter="url(#neonGlow)" opacity="0.85"/>
  <polygon points="256,120 376,256 256,256" fill="url(#glassFacet)"/>
  <polygon points="136,256 256,392 256,256" fill="#0c4a6e" opacity="0.4"/>
  
  <!-- Core Focus Crystal -->
  <polygon points="256,180 320,256 256,332 192,256" fill="#ffffff" opacity="0.9"/>
  <circle cx="256" cy="256" r="8" fill="#070f1a"/>

  <!-- Ambient Light Sparks -->
  <circle cx="170" cy="150" r="3.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="340" cy="170" r="4" fill="#2dd4bf" opacity="0.8"/>
  <circle cx="310" cy="360" r="3" fill="#38bdf8" opacity="0.6"/>
</svg>